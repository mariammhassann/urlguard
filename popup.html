<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URLGuard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      background: #12112a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: #0c0b20;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e1d3a;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon { font-size: 20px; }
    .brand-name { font-weight: 800; font-size: 15px; color: #a78bfa; letter-spacing: 0.3px; }
    .brand-sub  { font-size: 10px; color: #4a5568; margin-top: 1px; }
    .btn-settings {
      background: none;
      border: 1px solid #2a2850;
      color: #7c8fa0;
      padding: 5px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-settings:hover { border-color: #a78bfa; color: #a78bfa; }

    /* ── API key status ── */
    .api-status { padding: 11px 16px; border-bottom: 1px solid #1e1d3a; display: flex; flex-direction: column; gap: 5px; }
    .key-row { display: flex; justify-content: space-between; align-items: center; }
    .key-name { font-size: 11px; color: #5a6478; }
    .key-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 99px;
    }
    .key-pill--ok      { background: rgba(34,197,94,0.12);  color: #4ade80; }
    .key-pill--missing { background: rgba(71,85,105,0.15);  color: #475569; }

    /* ── Warning banner ── */
    .warn-banner {
      margin: 8px 14px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #fbbf24;
      display: none;
    }
    .warn-banner.visible { display: block; }
    .warn-banner a { color: #a78bfa; cursor: pointer; text-decoration: underline; }

    /* ── Section title ── */
    .section-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 16px 5px;
    }
    .section-title { font-size: 10px; font-weight: 700; color: #3d4a5c; text-transform: uppercase; letter-spacing: 0.6px; }
    .btn-clear {
      background: none; border: none; color: #3d4a5c;
      font-size: 10px; cursor: pointer; font-family: inherit;
      transition: color 0.15s;
    }
    .btn-clear:hover { color: #f87171; }

    /* ── History list ── */
    .history { max-height: 285px; overflow-y: auto; }
    .history::-webkit-scrollbar { width: 3px; }
    .history::-webkit-scrollbar-track { background: transparent; }
    .history::-webkit-scrollbar-thumb { background: #1e1d3a; border-radius: 99px; }

    .h-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-bottom: 1px solid #0e0d22;
      transition: background 0.1s;
    }
    .h-item:hover { background: #0e0d22; }
    .h-icon { font-size: 14px; flex-shrink: 0; }
    .h-body { flex: 1; overflow: hidden; }
    .h-url {
      font-size: 11px; color: #7c8fa0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: 'Cascadia Code','SF Mono',monospace;
    }
    .h-verdict { font-size: 10px; font-weight: 600; margin-top: 1px; }
    .h-verdict--safe       { color: #4ade80; }
    .h-verdict--suspicious { color: #fbbf24; }
    .h-verdict--malicious  { color: #f87171; }
    .h-verdict--error      { color: #64748b; }
    .h-time { font-size: 10px; color: #334155; flex-shrink: 0; }

    /* ── Empty state ── */
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: #334155;
    }
    .empty-icon { font-size: 34px; margin-bottom: 10px; }
    .empty-text { font-size: 12px; line-height: 1.6; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid #1e1d3a;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-tip { font-size: 10px; color: #2d3748; }
    .footer-ver { font-size: 10px; color: #2d3748; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div>
        <div class="brand-name">URLGuard</div>
        <div class="brand-sub">URL Security Scanner</div>
      </div>
    </div>
    <button class="btn-settings" id="btnSettings">⚙ Settings</button>
  </div>

  <div class="api-status">
    <div class="key-row">
      <span class="key-name">VirusTotal API</span>
      <span class="key-pill" id="vtPill">—</span>
    </div>
    <div class="key-row">
      <span class="key-name">Google Safe Browsing API</span>
      <span class="key-pill" id="gsbPill">—</span>
    </div>
  </div>

  <div class="warn-banner" id="warnBanner">
    ⚠️ No API keys configured.
    <a id="warnLink">Open Settings →</a>
  </div>

  <div class="section-bar">
    <span class="section-title">Recent Scans</span>
    <button class="btn-clear" id="btnClear">Clear all</button>
  </div>

  <div class="history" id="historyList"></div>

  <div class="footer">
    <span class="footer-tip">Right-click any link to scan</span>
    <span class="footer-ver">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
