<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaceBook Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      width: 380px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #1877f2;
      margin-bottom: 10px;
      font-size: 38px;
      font-weight: bold;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1877f2;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #166fe5;
    }

    .warning {
      margin-top: 20px;
      font-size: 13px;
      color: #d93025;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Facebook</h1>
    <p>Connect with your friends and the world around you.</p>

    <form onsubmit="showDemo(event)">
      <input type="text" placeholder="Email address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
  </div>

  <script>
    function showDemo(event) {
      event.preventDefault();
      alert("This is a cybersecurity awareness demonstration. No credentials were stored.");
    }
  </script>
</body>
</html>
